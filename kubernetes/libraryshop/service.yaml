apiVersion: v1
kind: Service
metadata:
  name: library-frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  selector:
    app: library-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
